# FlowUp — CI (BE-01 D10, §9).
#
# Runs on a clean checkout. It never prints a secret value and requires no
# credential beyond ephemeral local service containers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'

jobs:
  static:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Frozen: the run fails on any lockfile drift.
      - name: Install
        run: bun install --frozen-lockfile

      # The Prisma client is generated, not committed. Generation does not
      # connect to a database; the URL below is a placeholder.
      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Unit, contract and redaction tests
        run: bun run test

  integration:
    name: Migrations and integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: flowup
          POSTGRES_PASSWORD: flowup_ci
          POSTGRES_DB: flowup
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flowup -d flowup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://flowup:flowup_ci@127.0.0.1:5432/flowup?schema=public
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply migrations
        run: bun run db:migrate:deploy

      # The service container does not set maxmemory-policy, so the queue
      # integration test's noeviction assertion is made against Compose in the
      # smoke job below. Set it here so the same suite passes in both places.
      - name: Configure Redis for coordination-only use
        run: redis-cli -h 127.0.0.1 CONFIG SET maxmemory-policy noeviction

      - name: Integration tests
        run: bun run test:integration

  smoke:
    name: Production-like Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Local, ephemeral values for a throwaway stack. Nothing here is a real
      # credential and nothing is echoed to the log.
      - name: Prepare environment
        run: |
          cp .env.example .env
          {
            echo "NODE_ENV=production"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "SECRET_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } >> .env

      - name: Build the three backend process images
        run: docker compose -f infrastructure/docker-compose.yml --env-file .env build

      - name: Start the stack
        run: bun run compose:up

      # TECHNICAL_DESIGN.md §10: assert every readiness probe, not just that
      # the containers are running.
      - name: Assert every readiness probe
        run: |
          set -euo pipefail
          compose="docker compose -f infrastructure/docker-compose.yml --env-file .env"

          for attempt in $(seq 1 60); do
            unhealthy=$($compose ps --format '{{.Service}} {{.Health}}' \
              | grep -E '^(api|dispatcher|worker|postgres|redis) ' \
              | grep -vc healthy || true)
            if [ "$unhealthy" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              $compose ps -a
              echo "::error::services did not become healthy"
              exit 1
            fi
            sleep 5
          done

          $compose ps -a --format '{{.Service}} {{.Health}}'

          # api answers its own readiness over the published port.
          curl -fsS http://127.0.0.1:3000/ready | tee /dev/stderr | grep -q '"status":"ready"'
          curl -fsS http://127.0.0.1:3000/health | grep -q '"status":"ok"'

          # dispatcher and worker answer on their in-container probe ports.
          $compose exec -T dispatcher wget -q -O- http://127.0.0.1:3001/ready | grep -q '"status":"ready"'
          $compose exec -T worker wget -q -O- http://127.0.0.1:3002/ready | grep -q '"status":"ready"'

          # Non-negotiable: eviction would silently drop coordination state.
          $compose exec -T redis redis-cli CONFIG GET maxmemory-policy | grep -q noeviction

      - name: Compose logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml --env-file .env logs --tail 200

      - name: Stop the stack
        if: always()
        run: bun run compose:down
