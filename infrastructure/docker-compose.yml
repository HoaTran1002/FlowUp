# FlowUp — local and production-like infrastructure (BE-01 D8).
#
# SYSTEM_ARCHITECTURE.md §3: one codebase, distinct containers for `api`,
# `dispatcher`, `worker`, `postgres` and `redis`, plus the static `web` bundle
# delivered by FE-01.
#
# `migrate` is a one-shot job, not a fourth application process: the three
# application services require applied migrations for their readiness probe to
# pass, so `compose up` has to apply them itself.

name: flowup

x-app-common: &app-common
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile
  user: '1000:1000'
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  environment: &app-env
    NODE_ENV: ${NODE_ENV:-development}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
    REDIS_URL: redis://redis:6379
    SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to loopback: host-run integration tests need it, the network does not.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # `maxmemory-policy noeviction` is non-negotiable (SYSTEM_ARCHITECTURE.md §3):
    # eviction would silently drop BullMQ coordination state. Persistence is on.
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    user: '1000:1000'
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ['bun', 'run', 'db:migrate:deploy']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-common
    environment:
      <<: *app-env
      API_PORT: ${API_PORT:-3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
      PUBLISH_MAX_BODY_BYTES: ${PUBLISH_MAX_BODY_BYTES:-262144}
    command: ['bun', 'apps/api/src/main.ts']
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --quiet --spider "http://127.0.0.1:${API_PORT:-3000}/ready" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  dispatcher:
    <<: *app-common
    environment:
      <<: *app-env
      DISPATCHER_POLL_INTERVAL_MS: ${DISPATCHER_POLL_INTERVAL_MS:-1000}
      DISPATCHER_PROBE_PORT: ${DISPATCHER_PROBE_PORT:-3001}
    command: ['bun', 'apps/dispatcher/src/main.ts']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --spider "http://127.0.0.1:${DISPATCHER_PROBE_PORT:-3001}/ready" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app-common
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_PROBE_PORT: ${WORKER_PROBE_PORT:-3002}
      DELIVERY_TIMEOUT_MS: ${DELIVERY_TIMEOUT_MS:-10000}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-5}
      DELIVERY_BACKOFF_BASE_MS: ${DELIVERY_BACKOFF_BASE_MS:-5000}
      DELIVERY_MAX_AGE_MS: ${DELIVERY_MAX_AGE_MS:-86400000}
      DELIVERY_MAX_RESPONSE_BYTES: ${DELIVERY_MAX_RESPONSE_BYTES:-65536}
    command: ['bun', 'apps/worker/src/main.ts']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --spider "http://127.0.0.1:${WORKER_PROBE_PORT:-3002}/ready" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # FE-01 D10: the dashboard is a static bundle, not a Node process. In
  # production it sits behind the HTTPS reverse proxy (SYSTEM_ARCHITECTURE.md
  # §3); the published port here is for local and smoke use only.
  #
  # `VITE_API_BASE_URL` is baked in at BUILD time and is not a secret. It is
  # the address the BROWSER uses to reach the api, so it must be reachable from
  # the user's machine, not from inside the Compose network.
  web:
    build:
      context: ..
      dockerfile: infrastructure/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - '${WEB_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --spider http://127.0.0.1:8080/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
