# FlowUp web — static SPA server (FE-01 D10).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the server version.
  server_tokens off;

  # NOTE: nginx does NOT inherit server-level `add_header` into a location that
  # declares its own `add_header`. The security headers are therefore repeated
  # in every location below that sets Cache-Control.

  # Container health probe. Unrelated to the API's /health (BE-01 §6.1).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build assets never change under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }

  # The shell must always be revalidated so a deploy takes effect immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
  }

  # SPA fallback: a deep link such as /app/deliveries?status=FAILED must serve
  # the shell and let the client router resolve it (FE-01 §4).
  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri /index.html;
  }
}
